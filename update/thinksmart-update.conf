# /etc/thinksmart-update.conf: where thinksmart-update looks for client releases.
# SOURCES: one or more https base URLs (space separated), tried in order; each must serve
#   latest/download/latest.json and download/<tag>/<file> (the GitHub Releases layout).
#   Plain http is accepted only for 127.0.0.1/localhost (a test server through an ssh tunnel).
#   Releases aren't signed: https plus the sha256 of every file in latest.json is the check.
#   Whoever serves these addresses decides what gets installed (as root): list only addresses you
#   control or trust, never a public GitHub download mirror or proxy site.
# Client releases are published on the client repository's GitHub Releases.
SOURCES="https://github.com/yehuangbin948/xiaozhi-thinksmart-client/releases/"
# HTTP proxy for the checks and downloads, e.g. http://proxy.example:8080 (empty: direct)
PROXY=""
# Group that may drop requests (the client and the kiosk run as ubuntu)
REQUEST_GROUP="ubuntu"
